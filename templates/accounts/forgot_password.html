{% extends 'base.html' %}

{% block title %}Forgot Password | JobConnect{% endblock %}

{% block content %}
<section class="py-6 my-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-8">
                <div class="card card-custom p-4 p-md-5 border-0 shadow-lg" style="border-radius: var(--radius-md);">
                    <div class="text-center mb-4">
                        <div class="display-6 text-primary mb-2"><i class="bi bi-key-fill"></i></div>
                        <h2 class="fw-bold">Reset Password</h2>
                        <p class="text-muted">Enter your registered details to recover your account</p>
                    </div>
                    
                    <form action="{% url 'forgot_password' %}" method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Username</label>
                            <input type="text" class="form-control py-2.5" id="username" name="username" required placeholder="Enter username">
                        </div>
                        
                        <div class="mb-4">
                            <label for="email" class="form-label fw-semibold">Email Address</label>
                            <input type="email" class="form-control py-2.5" id="email" name="email" required placeholder="Enter email address">
                        </div>
                        
                        <button type="submit" class="btn btn-primary-custom w-100 py-3 mb-3">Reset Password</button>
                    </form>
                    
                    <div class="text-center mt-3">
                        <a href="{% url 'login' %}" class="small text-decoration-none text-primary fw-medium"><i class="bi bi-arrow-left"></i> Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
