{% extends 'base.html' %}

{% block title %}Sign In | JobConnect{% endblock %}

{% block content %}
<section class="py-6 my-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-8">
                <div class="card card-custom p-4 p-md-5 border-0 shadow-lg" style="border-radius: var(--radius-md);">
                    <div class="text-center mb-4">
                        <div class="display-6 text-primary mb-2"><i class="bi bi-person-circle"></i></div>
                        <h2 class="fw-bold">Welcome Back</h2>
                        <p class="text-muted">Sign in to your JobConnect account</p>
                    </div>
                    
                    <form action="{% url 'login' %}" method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control py-2.5" id="username" name="username" required placeholder="Enter username">
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <div class="d-flex justify-content-between mb-1">
                                <label for="password" class="form-label fw-semibold mb-0">Password</label>
                                <a href="{% url 'forgot_password' %}" class="small text-decoration-none text-primary">Forgot Password?</a>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control py-2.5" id="password" name="password" required placeholder="Enter password">
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-primary-custom w-100 py-3 mb-3">Sign In</button>
                    </form>
                    
                    <hr class="my-4">
                    
                    <div class="text-center">
                        <p class="text-muted mb-2">New to JobConnect?</p>
                        <div class="d-flex justify-content-center gap-2">
                            <a href="{% url 'seeker_register' %}" class="fw-semibold text-decoration-none text-primary">Register Seeker</a>
                            <span class="text-muted">|</span>
                            <a href="{% url 'recruiter_register' %}" class="fw-semibold text-decoration-none text-secondary">Register Recruiter</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
